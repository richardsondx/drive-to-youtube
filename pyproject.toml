[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drive2yt"
version = "0.1.0"
description = "Upload a video from Google Drive (or a local file) to YouTube from the command line."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Richardson Dackam"}]
dependencies = [
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.0",
  "google-auth-httplib2>=0.1",
]

[project.scripts]
drive2yt = "drive2yt.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["drive2yt*"]
